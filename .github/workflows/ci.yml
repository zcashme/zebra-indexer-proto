# Tests, and the two things this crate promises:
#   1. the committed generated code matches the protos
#   2. proto/ matches Zebra's zebra-rpc/proto at ZEBRA_TAG

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ZEBRA_TAG: v7.0.0

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # The runner image does NOT ship protoc. It's needed for both the tests
      # (--all-features enables `regenerate`, which runs build.rs codegen) and
      # the bindings-match check below.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Tests
        run: cargo test --locked --all-features

      - name: Committed bindings match the proto
        run: |
          cargo build --locked --features regenerate
          git diff --exit-code -- proto/__generated__/

      # diff -r also fails on a proto Zebra has and this crate doesn't vendor.
      - name: Protos match Zebra at ZEBRA_TAG
        run: |
          git -c advice.detachedHead=false clone --quiet --depth 1 --branch "$ZEBRA_TAG" --filter=blob:none --sparse \
            https://github.com/ZcashFoundation/zebra.git "$RUNNER_TEMP/zebra"
          git -C "$RUNNER_TEMP/zebra" sparse-checkout set zebra-rpc/proto
          if ! diff -r --exclude=__generated__ "$RUNNER_TEMP/zebra/zebra-rpc/proto" proto; then
            echo "::error::proto/ differs from Zebra $ZEBRA_TAG zebra-rpc/proto"
            exit 1
          fi

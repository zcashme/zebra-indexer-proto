# Tests, and the two things this crate promises:
#   1. the committed generated code matches proto/indexer.proto
#   2. proto/indexer.proto matches Zebra's at ZEBRA_TAG

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ZEBRA_TAG: v7.0.0

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # The runner image does NOT ship protoc. It's needed for both the tests
      # (--all-features enables `regenerate`, which runs build.rs codegen) and
      # the bindings-match check below.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Tests
        run: cargo test --locked --all-features

      - name: Committed bindings match the proto
        run: |
          cargo build --locked --features regenerate
          git diff --exit-code -- proto/__generated__/

      - name: Proto matches Zebra at ZEBRA_TAG
        run: |
          curl -fsSL -o "$RUNNER_TEMP/indexer.proto" \
            "https://raw.githubusercontent.com/ZcashFoundation/zebra/$ZEBRA_TAG/zebra-rpc/proto/indexer.proto"
          if ! diff proto/indexer.proto "$RUNNER_TEMP/indexer.proto"; then
            echo "::error::proto/indexer.proto differs from Zebra $ZEBRA_TAG"
            exit 1
          fi
